<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Closet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%9E%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Closet</h1>
            <p class="subtitle">Photos in, wardrobe out</p>
        </header>

        <nav class="nav">
            <button class="nav-tab active" data-view="studio">Add</button>
            <button class="nav-tab" data-view="closet">Closet <span class="nav-count" id="count-closet"></span></button>
            <button class="nav-tab" data-view="outfits">Outfits</button>
            <button class="nav-tab" data-view="insights">Insights</button>
            <button class="nav-tab" data-view="settings">Settings</button>
        </nav>

        <div class="busy" id="busy"></div>

        <main>
            <section class="view active" id="view-studio"></section>
            <section class="view" id="view-closet"></section>
            <section class="view" id="view-outfits"></section>
            <section class="view" id="view-insights"></section>
            <section class="view" id="view-settings"></section>
        </main>

        <footer class="app-footer">
            <p>Your pieces and photos stay on this device. A photo only leaves it when you ask Claude to read one.</p>
        </footer>
    </div>

    <div class="modal" id="modal"></div>
    <div class="toasts" id="toasts"></div>

    <datalist id="subtype-options"></datalist>
    <datalist id="material-options"></datalist>

    <script type="module" src="js/app.js"></script>
</body>
</html>
