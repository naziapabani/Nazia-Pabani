<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Niafied Closet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23181f2d'/%3E%3Ctext x='50' y='72' font-family='Impact,sans-serif' font-size='74' fill='%2383a4cd' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="edge-word" id="edge-word" aria-hidden="true">Niafied Closet</div>

    <div class="app-container">
        <header class="app-header">
            <img class="mark" src="assets/niafied-mark.png" alt="Niafied">
            <div class="masthead">
                <span class="wordmark">Niafied</span>
                <h1>Closet</h1>
                <p class="subtitle">photos in, wardrobe out</p>
            </div>
        </header>

        <nav class="nav">
            <button class="nav-tab active" data-view="studio">Add</button>
            <button class="nav-tab" data-view="closet">Closet <span class="nav-count" id="count-closet"></span></button>
            <button class="nav-tab" data-view="outfits">Outfits</button>
            <button class="nav-tab" data-view="insights">Insights</button>
            <button class="nav-tab" data-view="settings">Settings</button>
        </nav>

        <div class="busy" id="busy"></div>

        <main>
            <section class="view active" id="view-studio"></section>
            <section class="view" id="view-closet"></section>
            <section class="view" id="view-outfits"></section>
            <section class="view" id="view-insights"></section>
            <section class="view" id="view-settings"></section>
        </main>

        <footer class="app-footer">
            <p>Your pieces and photos stay on this device. A photo only leaves it when you ask Claude to read one.</p>
            <p class="footer-mark">Niafied — a multidisciplinary design studio</p>
        </footer>
    </div>

    <div class="modal" id="modal"></div>
    <div class="toasts" id="toasts"></div>

    <datalist id="subtype-options"></datalist>
    <datalist id="material-options"></datalist>

    <script type="module" src="js/app.js"></script>
</body>
</html>
